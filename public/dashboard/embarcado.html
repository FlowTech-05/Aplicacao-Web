<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex">
    <div class="flex flex-col gap-5 bg-gray-200 w-[18%] h-screen justify-center items-center p-1">
        <p>Olá <span>Usuário</span>!</p>
        <img>
        <div class="bg-gray-300 p-3 rounded-sm font-bold">Computadores Embarcados</div>
        <div>Dashboard</div>    
        <div>Sair</div>
    </div>
    <div class="flex flex-1 flex-col items-center gap-10">
        <div class="flex items-center flex-row bg-gray-200 justify-between w-[90%] p-3 m-2 rounded-sm">
            <span>Exibindo todos os computadores embarcados da empresa X:</span>
            <button class="bg-green-400 p-2 rounded-sm" onclick="exibirPainel()">Cadastrar novo embarcado</button>
        </div>
        <div class="flex flex-col">
            <div class="flex flex-row gap-7 h-10 bg-gray-300 p-6.5 rounded-t-sm justify-center items-center">
                <div><b>Nome:</b> Computador Embarcado - 01</div>
                <div><b>Pórtico:</b> XPTO - 99</div>
                <div><b>Status:</b> Ativo</div>
                <button class="bg-red-600 p-1.5 rounded-sm">Apagar</button>
                <button class="bg-yellow-600 p-1.5 rounded-sm">Editar</button>
            </div>
            <div class="flex flex-col gap-2 h-fit bg-gray-200 pt-3.5 pb-3.5 pr-6.5 pl-6.5 rounded-b-sm justify-center">
                <h5 class="font-bold">Componentes monitorados:</h5>
                <div>CPU</div>
                <div>RAM</div>
                <div>DISCO</div>
            </div>
        </div>
    </div>
    <div id="painel" class="flex fixed inset-0 bg-black/50 justify-center items-center flex-col hidden">
        <div class="flex flex-col">
            <div class="painel-crud flex flex-col bg-gray-300 h-fit rounded-t-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7">
                <div class="flex flex-row justify-between">
                    <h5>Preencha as informações do novo embarcado:</h5>
                    <button onclick="fecharPainel()"><img src="../assets/x.png"></button>
                </div>
            </div>
            <div class="painel-crud flex flex-col bg-gray-200 h-fit p-6.5 gap-7 items-center">
                <div class="flex items-center gap-3">
                    <span class="w-20">Nome: </span>
                    <input type="text" class="bg-white rounded-sm">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-20">Pórtico: </span>
                    <input type="text" class="bg-white rounded-sm">
                </div>
                <div class="flex items-center gap-3">
                    <span>Status: </span>
                    <select class="bg-white rounded-sm pt-1.5 pb-1.5 pr-2.5 pl-2.5">
                        <option value="">Ativo</option>
                        <option value="">Inativo</option>
                    </select>
                </div>
            </div>
            <div class="painel-crud flex flex-col bg-gray-300 h-fit rounded-b-sm pt-3.5 pb-3.5 pr-6.5 pl-6.5 gap-7 justify-center items-center">
                <button class="bg-green-600/50 w-fit p-1 rounded-sm" onclick="fecharPainel()">Salvar novo embarcado</button>
            </div>
        </div>
    </div>
</body>
</html>
<script src="../js/dashboard.js"></script>
