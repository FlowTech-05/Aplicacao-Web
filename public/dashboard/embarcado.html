<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex">
    <div class="flex flex-col gap-5 bg-gray-200 w-[18%] h-screen justify-center items-center p-1">
        <p>Olá <span>Usuário</span>!</p>
        <img>
        <div class="bg-gray-300 p-3 rounded-sm font-bold">Computadores Embarcados</div>
        <div>Dashboard</div>    
        <div>Sair</div>
    </div>
    <div class="flex flex-1 flex-col items-center gap-10">
        <div class="flex items-center flex-row bg-gray-200 justify-between w-[90%] p-3 m-2 rounded-sm">
            <span>Exibindo todos os computadores da empresa X:</span>
            <button class="bg-green-400 p-2 rounded-sm">Cadastrar novo embarcado</button>
        </div>
        <div class="flex flex-col">
            <div class="flex flex-row gap-10 h-10 bg-gray-300 p-6.5 rounded-sm justify-center items-center">
                <div>Nome: Computador Embarcado - 01</div>
                <div>Status: Ativo</div>
                <button class="bg-red-600 p-1.5 rounded-sm">Apagar</button>
                <button class="bg-yellow-600 p-1.5 rounded-sm">Editar</button>
            </div>
            <div class="flex flex-col gap-2 h-fit bg-gray-200 pt-3.5 pb-3.5 pr-6.5 pl-6.5 rounded-sm justify-center">
                <h5 class="font-bold">Componentes monitorados:</h5>
                <div>CPU</div>
                <div>RAM</div>
                <div>DISCO</div>
            </div>
        </div>
    </div>
</body>
</html>
